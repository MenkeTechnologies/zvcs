name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Stock git the parity tests compare against. The port targets 2.56; the
  # runners ship 2.55, which differs in real behaviour (e.g. `blame -b`
  # padding). Built from the kernel.org release tarball; the sha256 is the one
  # in kernel.org's sha256sums.asc, whose signature (Kernel.org checksum
  # autosigner, B886 8C80 BA62 A1FF FAF5 FDA9 632D 3A06 589D A6B1) was checked
  # when this was pinned, as was Junio C Hamano's signature on the tarball
  # (96E0 7AF2 5771 9559 80DA D100 20D0 4E5A 7136 60A7).
  STOCK_GIT_VERSION: 2.56.0
  STOCK_GIT_SHA256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache stock git
        id: stock-git
        uses: actions/cache@v4
        with:
          path: ~/.local/stock-git
          key: stock-git-${{ runner.os }}-${{ runner.arch }}-${{ env.STOCK_GIT_VERSION }}-${{ env.STOCK_GIT_SHA256 }}
      - name: Build stock git
        if: steps.stock-git.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          fi
          tarball="git-$STOCK_GIT_VERSION.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/$tarball"
          echo "$STOCK_GIT_SHA256  $RUNNER_TEMP/$tarball" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-$STOCK_GIT_VERSION" -j"$(getconf _NPROCESSORS_ONLN)" \
            prefix="$HOME/.local/stock-git" \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PYTHON=YesPlease \
            all install
      # First on PATH, and named explicitly for the parity harness
      # (src/parity/src/stock.rs honours ZVCS_STOCK_GIT before its fallbacks).
      - name: Use stock git
        run: |
          echo "$HOME/.local/stock-git/bin" >> "$GITHUB_PATH"
          echo "ZVCS_STOCK_GIT=$HOME/.local/stock-git/bin/git" >> "$GITHUB_ENV"
      - name: Check stock git version
        run: |
          for g in git "$ZVCS_STOCK_GIT"; do
            v=$("$g" --version)
            echo "$g: $v"
            case "$v" in
              "git version $STOCK_GIT_VERSION"|"git version $STOCK_GIT_VERSION".*) ;;
              *) echo "expected git $STOCK_GIT_VERSION, got: $v" >&2; exit 1 ;;
            esac
          done
      # Tests spawn the real `git` binary to build fixtures (a `git commit`
      # requires a committer identity) and the zdaemon autobumps commits; a
      # fresh runner has no git identity. Export the identity via git's
      # GIT_AUTHOR_*/GIT_COMMITTER_* env vars — they apply to every git
      # invocation (including fixture repos in temp dirs) without mutating
      # runner-persistent global config.
      #
      # NOTE: these env vars OUTRANK `user.name`/`user.email` config, including
      # `-c user.name=...`. A test that attributes commits to particular authors
      # through config must clear them (`Command::env_remove`) or it silently
      # gets this identity instead — which is exactly how
      # blame_ignore_whitespace came to pass locally and fail on every runner.
      - name: Configure git identity
        run: |
          {
            echo "GIT_AUTHOR_NAME=zvcs ci"
            echo "GIT_AUTHOR_EMAIL=ci@zvcs.test"
            echo "GIT_COMMITTER_NAME=zvcs ci"
            echo "GIT_COMMITTER_EMAIL=ci@zvcs.test"
          } >> "$GITHUB_ENV"
      # The workspace member is the `zvcs` package (the `git` shadow binary +
      # coordination layer); src/ported gitoxide is a separate excluded
      # workspace. Build the binary, then run the coordination test that proves
      # the zdaemon FIFO barrier holds peak critical-section occupancy at 1.
      - name: Build
        run: cargo build --release --locked --bin git
      - name: Test
        run: cargo test --release --locked --no-fail-fast
