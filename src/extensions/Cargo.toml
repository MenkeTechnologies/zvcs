[package]
name = "zvcs"
description = "git-shadowing superset VCS: the shadow `git` binary and coordination layer"
version = "0.22.5"
edition = "2021"
rust-version = "1.85"

# The engine as a library, so integration tests can drive it directly.
[lib]
name = "zvcs"
path = "src/lib.rs"

# build.rs harvests each porcelain verb's option/subcommand literals from source
# into the `git zrepl` completion table — the parser is the source of truth, so
# the completion set can never drift from what the verb actually accepts.
[build-dependencies]
regex = "1"

# The one and only binary: `git`. It shadows stock git on PATH and serves every
# subcommand natively via the vendored gitoxide crates — no fork/exec of old git.
[[bin]]
name = "git"
path = "src/main.rs"

[dependencies]
# Vendored gitoxide, in-tree at src/ported. Default features include sha1 + max-performance.
# blocking-http-transport-reqwest-rust-tls enables blocking fetch over https with a
# pure-Rust TLS stack (no curl/openssl C toolchain) — used by zsync's reconcile.
# `merge` backs merge-tree/merge-file; it pulls in tree-editor + blob-diff.
gix = { path = "../ported/gix", features = [
    "blocking-http-transport-reqwest-rust-tls",
    "tree-editor",
    "merge",
    "sha256",
] }
# Clone progress rendering. gitoxide already depends on prodash 31.0.0 (registry)
# and drives fetch/checkout through its progress traits; enabling the line
# renderer here (features unify with gix's copy) lets `git clone` show the remote
# sideband progress + local receive/resolve/checkout status to stderr, like git.
prodash = { version = "31.0.0", features = [
    "render-line",
    "render-line-crossterm",
    "render-line-autoconfigure",
    "progress-tree",
    "unit-bytes",
    "unit-human",
] }
anyhow = "1"
# Vectorized substring search for the `-S` pickaxe count (git uses a kwset for
# the same reason). Already in the tree via gitoxide.
memchr = "2"
# Display width for git's log tab expansion (its `utf8_width`): a tab stop is
# a column, and a wide character takes two. Already in the tree via ratatui.
unicode-width = "0.2"
# `git mailinfo`'s charset re-coding, which git delegates to iconv(3)
# (utf8.c:reencode_string_len). Costs nothing new: the vendored `gix-filter`
# already depends on encoding_rs for `working-tree-encoding`, so it is linked
# into the binary either way. Legacy-label handling differs from iconv in one
# place that matters — WHATWG aliases `iso-8859-1`/`latin1` to windows-1252 —
# so mailinfo decodes those two itself and only falls through to the crate for
# labels iconv and WHATWG agree on.
encoding_rs = "0.8"
# POSIX-ERE value-pattern matching for `git config <name> <value> <value-pattern>`.
# Foundational, vendorable crate; byte-oriented `regex::bytes` mirrors git's regexec.
regex = "1"
# File-watch autonomy: the daemon reacts to local ref changes (a `git pull`/commit
# updates `logs/HEAD` / remote-tracking refs) and never polls a remote.
notify = "6"
# Job ledger + repo index. Bundled SQLite for cross-arch reproducibility
# (macOS aarch64 / Linux x86_64+aarch64); WAL, single daemon writer thread.
# The derived-answer caches do NOT live here — see `rcache`.
rusqlite = { version = "0.32", features = ["bundled"] }
# Zero-copy caches for derived answers (`rcache`): tree diffs, blames and object
# abbreviations are pure functions of immutable objects, so they are read in place
# out of an mmap'd archive instead of being decoded row by row out of SQLite.
# `archive_le` fixes the byte order so one image is readable on macOS aarch64 and
# Linux x86_64/aarch64 alike; `size_32` keeps relative pointers four bytes wide.
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
# The mapping behind those images. Already in the tree via gitoxide.
memmap2 = "0.9"
# Fast parallel filesystem walk for the repo crawler (whole-device `.git` scan).
ignore = "0.4"
# Job spec encoding over the daemon socket (async z-verbs).
serde_json = "1"
# Terminal paging: dup2/isatty/close to splice the pager onto fd 1/2, as git does.
libc = "0.2"
# Interactive line editor for `git zrepl` (history, cursor motion, ctrl-c/ctrl-d).
# crossterm 0.29 matches prodash's copy above, so no second crossterm is pulled in.
# Only the interactive (tty) path uses it; piped stdin stays a raw line reader.
reedline = "0.49"
# TUI for `git ztop` — the live, churn-sorted fleet monitor (toasts + colorscheme
# ported from htoprs). 0.30 re-exports crossterm 0.29, matching the copy above, so
# still no second crossterm is pulled in. Only the tty path uses it.
ratatui = { version = "0.30.0", default-features = false, features = ["std", "crossterm"] }
# `git send-email`'s SMTP socket transport: implicit TLS (`--smtp-encryption
# ssl`) and STARTTLS (`tls`), driven from a blocking `StreamOwned` over the
# TcpStream. The vendored gitoxide TLS stack above already pulls rustls in
# transitively (`blocking-http-transport-reqwest-rust-tls`), so naming it here
# adds no crate to the tree; the versions are the ones already in Cargo.lock.
rustls = "0.23.42"
# The certificate and private-key types, plus the PEM reader behind
# `sendemail.smtpSSLCertPath`, `smtpSSLClientCert` and `smtpSSLClientKey`.
# `std` is what turns on the file-reading half of `pki_types::pem`.
rustls-pki-types = { version = "1.15.0", features = ["std"] }
# The platform trust store, which is where `ssl_verify_params()` leaves the
# handshake when no CA path is configured ("use the OpenSSL defaults").
rustls-native-certs = "0.8.4"

# The native plugin system (`git znative`). `libloading` is the dlopen wrapper
# the plugin host loads a plugin cdylib through; the ABI itself is the
# dependency-free `zvcs-native` crate in this workspace, which both the host and
# every plugin compile against so the two agree on the exact struct layout.
libloading = "0.8"
znative = { package = "zvcs-native", path = "../plugin" }
# The plugin store's manifest (`znative.toml`) and install index
# (`installed.toml`). Foundational, vendorable crates; `serde`'s derive is what
# the index round-trips through.
toml = "1"
serde = { version = "1", features = ["derive"] }
# SHA-256 integrity pinning for an installed plugin tree. Already in the tree
# via the vendored gitoxide, so naming it adds no crate.
sha2 = "0.11"

# macOS Keychain FFI for `git credential-osxkeychain` <get|store|erase>. The
# vendored gitoxide TLS stack already pulls this crate in transitively; naming it
# directly gives the helper the raw Security.framework symbols git's
# contrib/credential/osxkeychain/git-credential-osxkeychain.c calls
# (SecKeychainFindInternetPassword / SecKeychainAddInternetPassword /
# SecKeychainItemDelete / SecKeychainItemFreeContent). SecKeychainItemCopyContent
# — the one symbol the crate omits — is declared locally in that helper. Only
# linked on macOS; every other target compiles the helper to a silent no-op.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2"
