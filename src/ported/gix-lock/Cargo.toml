lints.workspace = true

[package]
name = "gix-lock"
version = "23.0.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A git-style lock-file implementation"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
rust-version = "1.85"

[lib]
doctest = true
test = true

[dependencies]
gix-utils = { version = "^0.3.4", default-features = false, path = "../gix-utils" }
gix-tempfile = { version = "^23.0.0", default-features = false, path = "../gix-tempfile" }
thiserror = "2.0.18"

[target.'cfg(not(windows))'.dependencies]
# `kill(pid, 0)` for `pid::holder` — git's `lockfile.c:274-277` probe of whether
# the process named by a `~pid.lock` companion is still alive. rustix wraps the
# syscall safely, which this crate needs: it is `#![deny(unsafe_code)]`, and
# rustix is already in the tree beneath `tempfile`.
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
tempfile = "3.26.0"
