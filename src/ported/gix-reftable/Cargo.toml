lints.workspace = true

[package]
name = "gix-reftable"
version = "0.1.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A port of git's reftable library: reading, writing and stacking reftable files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.85"

[lib]
doctest = false
test = true

[dependencies]
gix-zlib = { version = "^0.1.0", path = "../gix-zlib" }
gix-lock = { version = "^23.0.0", path = "../gix-lock" }
gix-tempfile = { version = "^23.0.0", default-features = false, path = "../gix-tempfile" }
gix-utils = { version = "^0.3.4", default-features = false, path = "../gix-utils" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.18"
memmap2 = "0.9.11"

[dev-dependencies]
tempfile = "3.26.0"
